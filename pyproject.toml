[project]
name = "llm-arbitration"
version = "0.1.0"
description = "A panel of critics checks LLM answers; a calibrated adjudicator turns their critiques into one verdict"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy==2.4.6", "scipy==1.17.1", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arbiter"]

[tool.setuptools.package-data]
arbiter = ["models.yaml"]
